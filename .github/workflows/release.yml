name: 'AVD Image Factory CD'

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'backend/**'
      - 'packer/**'
      - '.github/workflows/deploy.yml'

jobs:
  validate-and-build:
    name: 'Validation & Image Deploy'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v3

    - name: Packer Init
      run: packer init ./packer/base.pkr.hcl

    - name: Packer Validate
      run: packer validate ./packer/base.pkr.hcl

    - name: Azure Image Builder Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build & Push Factory Containers
      run: |
        az acr login --name acrfactory
        docker build -t acrfactory.azurecr.io/devopstrio/factory-api:${{ github.sha }} ./backend
        docker push acrfactory.azurecr.io/devopstrio/factory-api:${{ github.sha }}

  helm-deployment:
    name: 'Platform Deployment'
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
    - name: Azure CLI Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: AKS Set Context
      uses: azure/aks-set-context@v3
      with:
        resource-group: 'rg-avd-image-factory-prd'
        cluster-name: 'aks-image-factory-prd'

    - name: Helm Rollout
      run: |
        helm upgrade --install image-factory ./helm/avd-image-factory \
        --namespace avd-image-prod --create-namespace \
        --set api.image.tag=${{ github.sha }}
